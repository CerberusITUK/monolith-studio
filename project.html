<script>
initProjectPage();
// Return to top button
(function() {
  var btn = document.getElementById('returnTop');
  if (!btn) return;
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) btn.classList.add('visible');
    else btn.classList.remove('visible');
  });
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
// If in iframe, hide Home button and show Preview button (only on index.html, not work.html)
(function() {
  var inIframe = window.self !== window.top;
  var homeBtn = document.getElementById('homeBtn');
  var previewBtn = document.getElementById('previewBtn');
  var inIframe = window.self !== window.top;
  var homeBtn = document.getElementById('homeBtn');
  var previewBtn = document.getElementById('previewBtn');
  var hash = location.hash.replace('#', '');
  if (inIframe) {
    if (homeBtn) homeBtn.style.display = 'none';
    var rt = document.getElementById('returnTop');
    if (rt) rt.style.display = 'none';
    // Only show Preview button if loaded from index.html, not work.html
    var fromWork = new URLSearchParams(location.search).get("from") === "work";
    if (previewBtn && !fromWork) {
      previewBtn.style.display = 'inline-flex';
      previewBtn.href = location.pathname + location.search + location.hash;
      previewBtn.target = '_top';
    } else if (previewBtn) {
      previewBtn.style.display = 'none';
    }
  } else {
    if (homeBtn && hash) homeBtn.href = 'index.html#' + hash;
  }
})();
</script>
