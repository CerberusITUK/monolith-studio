<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Debug</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.8); color: #0f0; padding: 12px 16px;
    font-size: 14px; line-height: 1.6; border-radius: 6px;
    pointer-events: none;
  }
  #hud .label { color: #88aaff; }
  #instructions {
    position: fixed; bottom: 10px; left: 10px; z-index: 10;
    color: #888; font-size: 12px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="hud">
  <div><span class="label" style="color:#ff4444">X (red):</span> <span id="rx">0.000</span></div>
  <div><span class="label" style="color:#44ff44">Y (green):</span> <span id="ry">0.000</span></div>
  <div><span class="label" style="color:#4488ff">Z (blue):</span> <span id="rz">0.000</span></div>
</div>
<div id="instructions">Drag to rotate X/Y &nbsp;|&nbsp; Arrow keys for Z</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="DRACOLoader.js"></script>
<script>
(function () {
  const THREE = window.THREE;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 20);
  camera.position.set(0.8, -1.5, -1.5);
  camera.lookAt(0, -0.2, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const keyLight = new THREE.DirectionalLight(0xffffff, 4.0);
  keyLight.position.set(0.2, 0.6, 0.4);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x88aaff, 2.0);
  fillLight.position.set(-0.5, 0.3, 0.3);
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0xff8866, 1.5);
  rimLight.position.set(0, -0.3, -0.5);
  scene.add(rimLight);

  // Procedural environment
  const envCanvas = document.createElement("canvas");
  envCanvas.width = 512; envCanvas.height = 256;
  const ectx = envCanvas.getContext("2d");
  const grad = ectx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#1a1a2e");
  grad.addColorStop(0.3, "#2a2a4e");
  grad.addColorStop(0.5, "#444466");
  grad.addColorStop(0.7, "#2a2a4e");
  grad.addColorStop(1, "#0a0a12");
  ectx.fillStyle = grad;
  ectx.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 40; i++) {
    ectx.fillStyle = "rgba(255,255,255," + (Math.random() * 0.15) + ")";
    ectx.fillRect(Math.random() * 512, Math.random() * 128, Math.random() * 60 + 10, 2);
  }
  const envTexture = new THREE.CanvasTexture(envCanvas);
  envTexture.mapping = THREE.EquirectangularReflectionMapping;

  const watchGroup = new THREE.Group();
  scene.add(watchGroup);

  // Axis helper — red=X, green=Y, blue=Z
  const axisLen = 1.5;
  const axisMat = function (color) { return new THREE.LineBasicMaterial({ color: color, linewidth: 2 }); };
  function makeAxis(dir, color) {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0), dir.clone().multiplyScalar(axisLen)
    ]);
    return new THREE.Line(geo, axisMat(color));
  }
  const axesGroup = new THREE.Group();
  axesGroup.add(makeAxis(new THREE.Vector3(1, 0, 0), 0xff0000)); // X red
  axesGroup.add(makeAxis(new THREE.Vector3(0, 1, 0), 0x00ff00)); // Y green
  axesGroup.add(makeAxis(new THREE.Vector3(0, 0, 1), 0x0000ff)); // Z blue
  watchGroup.add(axesGroup);

  // Load model
  const loader = new THREE.GLTFLoader();
  loader.setDRACOLoader(new THREE.DRACOLoader().setDecoderPath("draco/"));
  loader.load("rolex.glb", function (gltf) {
    const model = gltf.scene;
    model.traverse(function (child) {
      if (child.isMesh) {
        child.material.vertexColors = false;
        if (child.name !== "glass" && child.name !== "floor") {
          child.material.envMap = envTexture;
          child.material.envMapIntensity = 1.5;
          child.material.needsUpdate = true;
        }
      }
    });
    const floor = model.getObjectByName("floor");
    if (floor) floor.visible = false;
    watchGroup.add(model);
    console.log("Model loaded");
  }, undefined, function (err) {
    console.warn("Load error:", err);
  });

  // Mouse rotation
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let rotX = 0, rotY = 0, rotZ = 0;

  renderer.domElement.addEventListener("mousedown", function (e) {
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  renderer.domElement.addEventListener("mousemove", function (e) {
    if (!isDragging) return;
    rotY += (e.clientX - lastX) * 0.01;
    rotX += (e.clientY - lastY) * 0.01;
    lastX = e.clientX; lastY = e.clientY;
  });
  renderer.domElement.addEventListener("mouseup", function () { isDragging = false; });
  renderer.domElement.addEventListener("mouseleave", function () { isDragging = false; });

  // Keyboard: Z rotation with arrow keys
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") rotZ -= 0.1;
    if (e.key === "ArrowRight") rotZ += 0.1;
  });

  // HUD
  const rxEl = document.getElementById("rx");
  const ryEl = document.getElementById("ry");
  const rzEl = document.getElementById("rz");

  function animate() {
    requestAnimationFrame(animate);
    watchGroup.rotation.x = rotX;
    watchGroup.rotation.y = rotY;
    watchGroup.rotation.z = rotZ;
    rxEl.textContent = rotX.toFixed(3);
    ryEl.textContent = rotY.toFixed(3);
    rzEl.textContent = rotZ.toFixed(3);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
